# Ports bind to loopback only: the API has dev routes enabled.
# MongoDB is not run here: the API stores everything in Atlas. Set MONGO_URI in .env.
services:
  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: ${MONGO_URI:?set MONGO_URI to your Atlas connection string in .env}
      MONGO_DB: ${MONGO_DB:-agentic_sdlc}
      ENABLE_DEV_ROUTES: "true"
    ports: ["127.0.0.1:8080:8080"]

  web:
    build: ./web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]
