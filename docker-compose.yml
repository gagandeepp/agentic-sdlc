# Ports bind to loopback only: Mongo has no auth and the API has dev routes enabled.
services:
  mongo:
    image: mongo:8.0
    ports: ["127.0.0.1:27017:27017"]
    volumes: [mongo-data:/data/db]
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    env_file:
      - path: .env
        required: false
    environment:
      MONGO_URI: mongodb://mongo:27017
      MONGO_DB: agentic_sdlc
      ENABLE_DEV_ROUTES: "true"
    ports: ["127.0.0.1:8080:8080"]
    depends_on:
      mongo:
        condition: service_healthy

  web:
    build: ./web
    ports: ["127.0.0.1:5173:80"]
    depends_on: [api]

volumes:
  mongo-data:
