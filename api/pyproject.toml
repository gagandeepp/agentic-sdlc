[project]
name = "agentic-sdlc-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.143",
  "uvicorn[standard]>=0.54",
  "pydantic>=2.14",
  "pydantic-settings>=2.15",
  "pymongo>=4.18",
  "claude-agent-sdk>=0.2.165",
  "nemoguardrails>=0.24.1,<0.25",
  "yara-python>=4.5",
  "pyyaml>=6.0",
  "httpx>=0.28",
]

[dependency-groups]
dev = [
  "pytest>=9.1",
  "pytest-asyncio>=1.4",
  "asgi-lifespan>=2.1",
  "testcontainers[mongodb]>=4.15",
  "ruff>=0.17",
  "mypy>=2.4",
  "types-pyyaml>=6.0.12.20260906",
  "jsonschema>=4.26.0",
  "types-jsonschema>=4.26.0.20261006",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"
# Fixture repo copied into agent workspaces: a separate project, not part of the API.
extend-exclude = ["app/dev/sample_repo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "RUF"]
ignore = ["E501"]  # ruff format owns line length

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^app/dev/sample_repo/"]

[[tool.mypy.overrides]]
module = ["testcontainers.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["nemoguardrails.*", "yara"]
ignore_missing_imports = true
